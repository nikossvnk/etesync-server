# Runs the Etebase server behind Caddy, which takes care of HTTPS (with certificates from Let's Encrypt).
# See README.md in this directory for how to set it up.

services:
  etebase:
    image: ${ETEBASE_IMAGE:-ghcr.io/nikossvnk/etesync-server}:${ETEBASE_VERSION:?Set ETEBASE_VERSION in .env}
    restart: unless-stopped
    # Docker keeps the logs of containers forever unless they are limited
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Only used the first time it's started, to create /data/etebase-server.ini
      ETEBASE_ALLOWED_HOSTS: ${ETEBASE_DOMAIN:?Set ETEBASE_DOMAIN in .env}
    volumes:
      - etebase-data:/data
    # Not published, it's only reachable through Caddy

  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    # Docker keeps the logs of containers forever unless they are limited
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - etebase
    environment:
      ETEBASE_DOMAIN: ${ETEBASE_DOMAIN}
      ADMIN_USER: ${ADMIN_USER:?Set ADMIN_USER in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # The access log, for fail2ban
      - ./logs:/var/log/caddy

volumes:
  # The database, the configuration, the secret key and the data of the items: this is what needs to be backed up
  etebase-data:
  # The certificates
  caddy-data:
  caddy-config:
