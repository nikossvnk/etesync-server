# Wrong passwords, in the access log that Caddy writes (as JSON lines): logging in to the app,
# and the password in front of the admin site. A browser first asks for the admin site without
# a password to find out that one is needed, so only requests with a password count.
[Definition]
datepattern = "ts":{EPOCH}
failregex = "remote_ip":"<HOST>".*"uri":"/api/v1/authentication/login/".*"status":401
            "remote_ip":"<HOST>".*"uri":"/admin[^"]*","headers":\{[^}]*"Authorization":.*"status":401
ignoreregex =
