# Opens pull requests to update the dependencies. The Check workflow runs on them, so an update
# that breaks the server is noticed before it's merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Stay on Django's long-term support release (5.2, supported until April 2028). Moving to the
      # next one (6.2) is done by hand. django-stubs' versions follow Django's.
      - dependency-name: django
        update-types: ["version-update:semver-major"]
      - dependency-name: django-stubs
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /tests/smoke
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories:
      - /docker/server
      - /docker/test-server
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
